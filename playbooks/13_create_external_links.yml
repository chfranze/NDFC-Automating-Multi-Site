---
- name: Task 13 - Create External VRF_LITE Links between Site1 and Internet Fabric
  hosts: localhost
  gather_facts: no
  vars:
    ndfc_host: 10.199.101.100
    ndfc_username: admin
    ndfc_password: Cisco123

  tasks:
    - name: Create VRF_LITE link from Leaf-101 to DC-Border
      cisco.dcnm.dcnm_links:
        state: merged
        src_fabric: Site1
        config:
          - dst_fabric: Internet
            src_interface: Ethernet1/3
            dst_interface: GigabitEthernet1
            src_device: 10.199.101.101  # Leaf-101 IP address
            dst_device: 10.199.101.200  # DC-Border IP address
            template: ext_fabric_setup
            profile:
              ipv4_subnet: 169.254.101.1/30      # Source IP with mask
              neighbor_ip: 169.254.101.2         # Destination IP
              src_asn: 65001                     # Source BGP ASN
              dst_asn: 100                       # Destination BGP ASN
              mtu: 1500
              auto_deploy: true                  # Auto-generate neighbor config
              vrf_lite_jython_template: "Ext_VRF_Lite_Jython_IOS_XE"  # IOS XE compatible template
              peer1_description: "Link to DC-Border from Leaf-101"
              peer2_description: "Link to Leaf-101 from DC-Border"
      vars:
        ansible_connection: httpapi
        ansible_network_os: cisco.dcnm.dcnm
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_user: "{{ ndfc_username }}"
        ansible_password: "{{ ndfc_password }}"
        ansible_host: "{{ ndfc_host }}"
      register: link1_result
      until: link1_result is not failed or "Deploy is already in progress" not in (link1_result.msg.DATA | default(''))
      retries: 5
      delay: 15
      
    - name: Display Leaf-101 link creation results
      debug:
        msg: "Leaf-101 (169.254.101.1) to DC-Border (169.254.101.2) link created - Changed: {{ link1_result.changed }}"
        
    - name: Wait before creating second link
      pause:
        seconds: 10
        
